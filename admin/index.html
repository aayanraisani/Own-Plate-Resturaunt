  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>[data-aos]{opacity:1!important;transform:none!important}</style></noscript>

  <script src="../js/core.js" defer></script>
  <script src="../js/art.js" defer></script>

</head>
<body class="admin">
<noscript><p class="p-4 text-center">Own-Plate needs JavaScript to show the menu and take orders.</p></noscript>
<section id="login" class="login d-none" aria-labelledby="login-title">
  <form id="login-form" class="form-card" novalidate>
    <a class="brand fs-3 d-inline-block mb-3" href="../index.html">Own<span>-</span>Plate</a>
    <h1 id="login-title" class="h4">Staff sign in</h1>
    <p class="text-muted small">Demo login: admin@own-plate.pk / ownplate2026</p>
    <div class="mb-3"><label class="form-label" for="login-email">Email</label><input class="form-control" id="login-email" name="email" type="email" autocomplete="username" required></div>
    <div class="mb-3"><label class="form-label" for="login-password">Password</label><input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" required></div>
    <p id="login-error" class="text-danger small d-none" role="alert">Wrong email or password. Check the details and try again.</p>
    <button class="btn btn-clay w-100" type="submit">Sign in</button>
  </form>
</section>
<div id="shell" class="admin-shell d-none">
  <aside class="admin-side">
    <a class="brand" href="../index.html">Own<span>-</span>Plate<small>Admin</small></a>
    <nav class="admin-nav" aria-label="Admin"><a href="#dashboard"><i class="bi bi-grid" aria-hidden="true"></i>Dashboard</a><a href="#orders"><i class="bi bi-bag" aria-hidden="true"></i>Orders</a><a href="#menu"><i class="bi bi-egg-fried" aria-hidden="true"></i>Menu</a><a href="#deals"><i class="bi bi-tags" aria-hidden="true"></i>Deals</a><a href="#coupons"><i class="bi bi-ticket-perforated" aria-hidden="true"></i>Promo codes</a><a href="#reservations"><i class="bi bi-calendar-event" aria-hidden="true"></i>Reservations</a><a href="#messages"><i class="bi bi-envelope" aria-hidden="true"></i>Messages</a><a href="#customers"><i class="bi bi-people" aria-hidden="true"></i>Customers</a><a href="#settings"><i class="bi bi-gear" aria-hidden="true"></i>Settings</a></nav>
    <div class="admin-side-foot">
      <a href="../index.html" target="_blank" rel="noopener" aria-label="View site"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i><span class="d-none d-lg-inline">View site</span></a>
      <button type="button" id="logout" aria-label="Sign out"><i class="bi bi-box-arrow-left" aria-hidden="true"></i><span class="d-none d-lg-inline">Sign out</span></button>
    </div>
  </aside>
  <main class="admin-main"><header class="admin-top"><h1 id="view-title" class="h3 mb-0"></h1></header><div id="view" aria-live="polite"></div></main>
</div>
<div class="modal fade" id="record-modal" tabindex="-1" aria-labelledby="record-title" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down"><form id="record-form" class="modal-content" novalidate>
    <div class="modal-header"><h2 class="modal-title h5" id="record-title"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"><div class="row g-3" id="record-fields"></div></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-indigo" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-clay">Save</button></div>
  </form></div>
</div>
</body>
</html>
