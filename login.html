<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="Sign in to reorder favourites, save addresses and track every order.">
  <title>Sign in | Own-Plate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f2b5e'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23e3a52f' stroke-width='8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>[data-aos]{opacity:1!important;transform:none!important}</style></noscript>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/art.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="login">
<noscript><p class="p-4 text-center">Own-Plate needs JavaScript to show the menu and take orders.</p></noscript>
<main id="main">
<div class="auth">
  <aside class="auth-side"><div data-art="burger" aria-hidden="true"></div><h2>Welcome back</h2><p>Sign in to reorder favourites, save addresses and track every order.</p></aside>
  <section class="auth-main"><div class="form-card" data-aos="fade-up">
  <h1 class="h3 mb-4">Sign in</h1>
  <form id="login-form" novalidate>
    <div class="mb-3"><div class="col-12"><label class="form-label" for="email">Email</label>
  <input class="form-control" id="email" name="email" type="email" autocomplete="username" required><div class="invalid-feedback">Enter a valid email address.</div></div></div>
    <div class="mb-2"><label class="form-label" for="password">Password</label>
  <div class="input-group"><input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="current-password" required>
  <button class="btn" type="button" data-toggle-password aria-label="Show password"><i class="bi bi-eye" aria-hidden="true"></i></button>
  <div class="invalid-feedback">Use at least 8 characters.</div></div></div>
    <p class="text-end small"><a href="forgot.html">Forgot password?</a></p>
    <button class="btn btn-clay w-100" type="submit">Sign in</button>
  </form>
  <p class="text-center text-muted mt-4 mb-0">New here? <a href="signup.html">Create an account</a></p></div></section>
</div>
</main>
</body>
</html>
