<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="Contact Own-Plate.">
  <title>Contact | Own-Plate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f2b5e'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23e3a52f' stroke-width='8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>[data-aos]{opacity:1!important;transform:none!important}</style></noscript>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/art.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="contact">
<noscript><p class="p-4 text-center">Own-Plate needs JavaScript to show the menu and take orders.</p></noscript>
<main id="main">
<header class="page-hero"><div class="container">
  <h1 data-aos="fade-up">Say salaam</h1><p data-aos="fade-up" data-aos-delay="100">Questions, feedback or catering enquiries. We read every message.</p></div></header>
<section class="section"><div class="container"><div class="row g-4">
  <div class="col-lg-5" data-aos="fade-up"><ul class="info-list">
    <li><i class="bi bi-geo-alt" aria-hidden="true"></i><span data-setting="address"></span></li>
    <li><i class="bi bi-telephone" aria-hidden="true"></i><a data-tel data-setting="phone"></a></li>
    <li><i class="bi bi-envelope" aria-hidden="true"></i><a data-mail data-setting="email"></a></li>
    <li><i class="bi bi-clock" aria-hidden="true"></i><span data-setting="hours"></span></li>
    <li><i class="bi bi-question-circle" aria-hidden="true"></i><a href="faq.html">Read our FAQ</a></li></ul></div>
  <div class="col-lg-7" data-aos="fade-up" data-aos-delay="100"><form id="contact-form" class="form-card" novalidate><div class="row g-3">
    <div class="col-md-6"><label class="form-label" for="name">Your name</label>
  <input class="form-control" id="name" name="name" type="text" autocomplete="name" required><div class="invalid-feedback">Please fill this in.</div></div>
    <div class="col-md-6"><label class="form-label" for="email">Email</label>
  <input class="form-control" id="email" name="email" type="email" autocomplete="email" required><div class="invalid-feedback">Enter a valid email address.</div></div>
    <div class="col-12"><label class="form-label" for="subject">Subject</label>
  <input class="form-control" id="subject" name="subject" type="text" required><div class="invalid-feedback">Please fill this in.</div></div>
    <div class="col-12"><label class="form-label" for="message">Message</label>
  <textarea class="form-control" id="message" name="message" rows="5" required minlength="10"></textarea><div class="invalid-feedback">Tell us a little more (10 characters minimum).</div></div>
    <div class="col-12"><button class="btn btn-clay btn-lg" type="submit">Send message</button></div>
  </div></form></div>
</div></div></section>
</main>
</body>
</html>
