<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="The full Own-Plate menu: burgers, fried chicken, pizza, desi bowls, wraps, sides, cold drinks and desserts.">
  <title>Menu | Own-Plate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f2b5e'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23e3a52f' stroke-width='8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>[data-aos]{opacity:1!important;transform:none!important}</style></noscript>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/art.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="menu">
<noscript><p class="p-4 text-center">Own-Plate needs JavaScript to show the menu and take orders.</p></noscript>
<main id="main">
<header class="page-hero"><div class="container">
  <h1 data-aos="fade-up">Our menu</h1><p data-aos="fade-up" data-aos-delay="100">Burgers, crispy chicken, pizza, desi bowls, wraps, sides, cold drinks and desserts. Tap any dish to customise it.</p></div></header>
<div class="menu-bar"><div class="container">
  <div id="menu-filters" class="pill-row mb-2" role="group" aria-label="Filter menu by category"></div>
  <div class="row g-2">
    <div class="col-md-8"><label class="visually-hidden" for="menu-search">Search the menu</label><input id="menu-search" class="form-control" type="search" placeholder="Search burgers, pizza, lassi..." autocomplete="off"></div>
    <div class="col-md-4"><label class="visually-hidden" for="menu-sort">Sort the menu</label><select id="menu-sort" class="form-select"><option value="popular">Recommended</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div>
  </div></div></div>
<section class="section" aria-label="Menu items"><div class="container"><div id="menu-grid" aria-live="polite"></div></div></section>
</main>
</body>
</html>
