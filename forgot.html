<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="Enter your email and we will help you get back in.">
  <title>Reset password | Own-Plate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f2b5e'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23e3a52f' stroke-width='8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="forgot">
<noscript><p class="p-4 text-center">Own-Plate needs JavaScript to show the menu and take orders.</p></noscript>
<main id="main">
<div class="auth">
  <aside class="auth-side"><div data-art="cup" aria-hidden="true"></div><h2>Forgot your password?</h2><p>Enter your email and we will help you get back in.</p></aside>
  <section class="auth-main"><div class="form-card" data-aos="fade-up">
  <h1 class="h3 mb-4">Reset password</h1>
  <form id="forgot-form" novalidate>
    <div class="mb-3"><div class="col-12"><label class="form-label" for="email">Email</label>
  <input class="form-control" id="email" name="email" type="email" autocomplete="email" required><div class="invalid-feedback">Enter a valid email address.</div></div></div>
    <button class="btn btn-clay w-100" type="submit">Send reset link</button>
  </form>
  <div id="forgot-note" class="alert alert-info mt-3 mb-0" hidden>Password reset emails switch on once our server goes live. Until then, <a href="contact.html">contact us</a> and we will reset it for you.</div>
  <p class="text-center text-muted mt-4 mb-0"><a href="login.html">Back to sign in</a></p></div></section>
</div>
</main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/art.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
